services:
  # MySQL Database Service on Render (Free Tier without paid disk)
  - type: pserv
    name: examsphere-mysql
    env: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile.mysql
    plan: free
    envVars:
      - key: MYSQL_DATABASE
        value: exam_portal
      - key: MYSQL_ROOT_PASSWORD
        value: rootpassword123

  # Spring Boot Backend Service on Render
  - type: web
    name: examsphere-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://examsphere-mysql:3306/exam_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_USERNAME
        value: root
      - key: SPRING_DATASOURCE_PASSWORD
        value: rootpassword123
      - key: JWT_SECRET
        value: 9a3f2c4d5e6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c
      - key: PORT
        value: 8080
