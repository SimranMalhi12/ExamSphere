# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

jwt.secret=${JWT_SECRET:9a3f2c4d5e6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c}
jwt.expiration=86400000

# Initial Admin Environment Configurations
initial.admin.name=${INITIAL_ADMIN_NAME:System Administrator}
initial.admin.email=${INITIAL_ADMIN_EMAIL:admin@examsphere.com}
initial.admin.password=${INITIAL_ADMIN_PASSWORD:Admin@123}

server.port=${PORT:8080}
logging.level.org.springframework.security=DEBUG